name: Android
# Android is built ONLY here (GitHub-hosted runners), never on a dev laptop.
# One Gradle run: debug + release APK, every unit test (models vs the shared fixtures, API client, contrast), and the Roborazzi
# screenshot record (Robolectric, no emulator): every screen in light and dark from demo data.
# Artifacts: `IELTS-android-debug-apk` (install on a device) and `android-screens` (PNGs for UI review).
on:
  workflow_dispatch:
  push:
    paths:
      - "apps/android/**"
      - "apps/ios/IELTS/Demo/fixtures.json" # the demo fixtures are shared with iOS
      - "apps/ios/IELTS/Demo/demo-map.png"
      - ".github/workflows/android.yml"

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # the screens/APK release below

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      # Upload key (repo secrets). Without it (forks, missing secrets) the release build falls back to the debug key and no .aab is made.
      - name: Decode the upload key
        env:
          KEYSTORE_B64: ${{ secrets.NEXTBAND_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.p12"
            echo "NEXTBAND_KEYSTORE=$RUNNER_TEMP/upload.p12" >> "$GITHUB_ENV"
          fi
      # Firebase config for push (repo secret). Without it (forks, PRs) the build skips the google-services plugin and push stays off.
      - name: Write google-services.json
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_B64" ]; then echo "$GOOGLE_SERVICES_JSON_B64" | base64 -d > app/google-services.json; fi
      - name: Build, test and record screenshots
        env:
          NEXTBAND_KEYSTORE_PASSWORD: ${{ secrets.NEXTBAND_KEYSTORE_PASSWORD }}
          NEXTBAND_KEY_ALIAS: ${{ secrets.NEXTBAND_KEY_ALIAS }}
          NEXTBAND_KEY_PASSWORD: ${{ secrets.NEXTBAND_KEY_PASSWORD }}
        run: |
          tasks="assembleDebug assembleRelease recordRoborazziDebug"
          [ -n "$NEXTBAND_KEYSTORE" ] && tasks="$tasks bundleRelease"
          ./gradlew $tasks --stacktrace --continue
      # Also a rolling pre-release per branch: release files don't count against the Actions artifact storage quota.
      - name: Publish screens and APKs to the branch's rolling release
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: android-${{ github.ref_name }}-latest
        run: |
          [ -d screenshots ] && (cd screenshots && zip -qr ../android-screens.zip .) || true
          files=$(ls android-screens.zip app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/release/app-release.apk app/build/outputs/bundle/release/app-release.aab 2>/dev/null || true)
          [ -z "$files" ] && exit 0
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --prerelease --target "$GITHUB_SHA" --title "$TAG" --notes "Rolling build from ${{ github.ref_name }}"
          gh release edit "$TAG" --notes "Rolling build from ${{ github.ref_name }} at $GITHUB_SHA"
          gh release upload "$TAG" $files --clobber
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: IELTS-android-debug-apk
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
          retention-days: 3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NextBand-android-release-apk
          path: apps/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: warn
          retention-days: 3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-screens
          path: apps/android/screenshots
          if-no-files-found: warn
          retention-days: 3
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: android-test-reports
          path: apps/android/app/build/reports/tests
          if-no-files-found: ignore
          retention-days: 3
