<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F7F9FB" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0A111C" media="(prefers-color-scheme: dark)" />
    <!-- Defaults; the server rewrites this block per page (apps/server/src/seo.ts) with the title, share card and structured data. -->
    <!--seo-->
    <title>NextBand: Free IELTS practice with instant band scores</title>
    <meta name="description" content="Practise IELTS Speaking, Writing, Listening and Reading online. Timed tests in the real exam format, an AI examiner, and band scores for every criterion with each mistake marked." />
    <meta property="og:image" content="/og/home.png?v=2" />
    <!--/seo-->
    <meta name="application-name" content="NextBand" />
    <meta name="apple-mobile-web-app-title" content="NextBand" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="icon" href="/favicon.ico?v=nb" sizes="32x32" />
    <link rel="icon" href="/icon.svg?v=nb" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=nb" />
    <link rel="manifest" href="/site.webmanifest" />

    <script>
      // Apply the theme before first paint (no flash). Mirrors components/layout/ThemeToggle.tsx.
      try {
        var t = localStorage.getItem('theme');
        if (t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark');
      } catch (e) {}
      // Installed app (home-screen launch): play the NextBand splash once per launch. Plain website visits never load it.
      try {
        if (matchMedia('(display-mode: standalone)').matches && !sessionStorage.getItem('nb-splash')) {
          sessionStorage.setItem('nb-splash', '1');
          var s = document.createElement('script');
          s.src = '/nextband/splash.js';
          document.head.appendChild(s);
        } else {
          // Website: a slow first load (still loading after 700 ms) gets the full splash; main.tsx closes it.
          setTimeout(function () {
            if (window.__nbReady || !document.getElementById('boot')) return;
            window.__nbSplashWait = true;
            var w = document.createElement('script');
            w.src = '/nextband/splash.js';
            document.head.appendChild(w);
          }, 700);
        }
      } catch (e) {}
      // The landing page ('/') paints its headline from the static shell in #root before any script runs, unless this
      // browser last saw an account (lib/query.ts ACCOUNT_HINT), which is redirected to /overview instead.
      try {
        if (location.pathname === '/' && localStorage.getItem('nb-acct') !== '1') document.documentElement.setAttribute('data-lp-pre', '');
      } catch (e) {
        if (location.pathname === '/') document.documentElement.setAttribute('data-lp-pre', '');
      }
      // Start the session check now, in parallel with the entry bundle; lib/query.ts meQuery adopts this response.
      if (!/^\/(login|signup|forgot-password|reset-password)\b/.test(location.pathname)) (window.__me = fetch('/api/me')).catch(function () {});
    </script>
    <!-- Scripting off: the boot cover would never lift, so it never shows. -->
    <noscript><style>#boot { display: none; }</style></noscript>
    <!-- The landing hero's static shell (#lp-pre): same type and grid as components/landing/sections/01-hero.css, so the
         headline is the first paint on a slow phone. React replaces it on mount; the hero then skips its headline intro.
         Colours are the landing ramp and brand in components/landing/landing.css :root (--lp-g-*, --lp-brand-*); this
         file cannot load that CSS before the script runs, so lp-pre.test.ts fails if these literals drift from it. -->
    <style>
      body { margin: 0; } /* as styles.css will have it: the shell must not shift 8px when the stylesheet lands */
      #lp-pre { display: none; }
      html[data-lp-pre] #lp-pre { display: block; min-height: 100svh; background: #f7f9fb; color: #0f172a; font-family: var(--font-sans, system-ui, sans-serif); }
      html.dark[data-lp-pre] #lp-pre { background: #0a111c; color: #e8edf3; } /* outranks the html[data-lp-pre] rule above */
      #lp-pre .w { max-width: 80rem; margin: 0 auto; padding: calc(4rem + 20px) 1rem 0; }
      #lp-pre h1 { margin: 0; font-family: var(--font-serif, Georgia, serif); font-weight: 500; font-size: clamp(2.75rem, 1.25rem + 3.6vw, 4.5rem); line-height: 1.06; letter-spacing: -0.03em; }
      /* One text block, not a block per line: Chrome scores the largest text block as LCP, so the shell headline stays
         the LCP and the React hero that replaces it (smaller blocks per line) does not push LCP out to the JS. */
      #lp-pre p { margin: 20px 0 0; max-width: 27em; font-size: 1.0625rem; line-height: 1.5; color: #5b6b80; }
      .dark #lp-pre p { color: #94a3b8; }
      #lp-pre a { display: inline-flex; align-items: center; min-height: 52px; margin-top: 24px; padding: 0 26px; border-radius: 999px; background: #0f766e; color: #ffffff; font-size: 1rem; font-weight: 600; text-decoration: none; }
      .dark #lp-pre a { background: #2dd4bf; color: #042f2c; }
      @media (min-width: 40rem) { #lp-pre p { font-size: 1.1875rem; } #lp-pre a { margin-top: 28px; } }
      @media (min-width: 48rem) { #lp-pre .w { padding-inline: 2rem; } }
      @media (min-width: 64rem) {
        #lp-pre .w { display: grid; grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.1fr); column-gap: clamp(32px, 4.4vw, 64px); align-items: center; min-height: 100svh; padding-top: 4rem; padding-bottom: 24px; }
        #lp-pre h1 { line-height: 1.02; width: max-content; }
      }
      @media (min-width: 80rem) { #lp-pre .w { padding-inline: 3rem; } }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Pages other than '/' get their own words here from the server (apps/server/src/seo.ts renderShell). -->
      <!--page-->
      <div id="lp-pre">
        <div class="w">
          <div>
            <h1>Know your band. <br>Know what to fix.</h1>
            <p>Practise all four IELTS skills and see every mistake marked.</p>
            <a href="/mock">Take a full mock free</a>
          </div>
        </div>
      </div>
      <!-- Scripting off: the landing page's story and its ways in (React replaces this on mount).
           Source of truth: components/landing/sections/*.tsx (heads and subs), wire.tsx StartFree (/mock), legal/Legal.tsx COMPANY and PAGES. -->
      <noscript>
        <main style="max-width: 40rem; margin: 0 auto; padding: 4rem 1rem; font-family: system-ui, sans-serif; line-height: 1.55">
          <h1 style="font-size: 2.25rem; line-height: 1.1; margin: 0 0 1rem">Know your band. Know what to fix.</h1>
          <p style="margin: 0 0 1.5rem">Practise all four IELTS skills and see every mistake marked. NextBand needs JavaScript to run the tests.</p>
          <p style="display: flex; flex-wrap: wrap; gap: 1rem; margin: 0 0 2rem">
            <a href="/mock">Take a full mock free</a>
            <a href="/pricing">Pricing</a>
            <a href="/login">Sign in</a>
          </p>
          <h2>Sit the whole test in one go.</h2>
          <p>Listening, Reading, Writing and Speaking, with a band for each and one overall.</p>
          <h2>Every answer has an address.</h2>
          <p>Your result points to the sentence in the passage or the audio that held each answer.</p>
          <h2>Exam mode, or practice mode.</h2>
          <p>Sit Listening and Reading the way the real test runs, or slow them down and go over the hard parts.</p>
          <h2>Your essay, marked in your own words.</h2>
          <p>Each mistake is underlined, with the fix and the reason beside it.</p>
          <h2>Task 1 too: charts, maps, processes and letters.</h2>
          <p>Academic or General Training, 20 minutes each, or the full Writing test on one 60-minute clock.</p>
          <h2>An AI examiner who listens and talks back.</h2>
          <p>Take Speaking live, then see each slip and pause in your transcript.</p>
          <h2>Record an answer. Get it back rewritten.</h2>
          <p>Practise Part 1, 2 or 3 at your own pace. Your result shows your pace, the sounds to work on and a top-band version of your own answer.</p>
          <h2>Your mistakes, sorted into habits.</h2>
          <p>Corrections from every test are grouped, then return as review cards.</p>
          <h2>Know exactly what to fix this week.</h2>
          <p>A coach plan written only from your results, one action per focus, counting down to your exam date.</p>
          <h2>Every question, open to search.</h2>
          <p>Browse every Speaking topic and Writing task by skill, part and type. No account needed.</p>
          <h2>Straight answers.</h2>
          <p>NextBand is practice, not the official test: bands are estimates. Academic and General Training are both covered, and tests you take without an account move to your account when you sign up.</p>
          <h2>Start tonight.</h2>
          <p>Free to begin. Pay once in taka if you stay: 1 month for 499 taka, 3 months for 1,199 taka, with a full refund within 7 days if unused.</p>
          <h2>Your first essay, marked tonight.</h2>
          <p><a href="/mock">Take a full mock free</a>. Free account, no card.</p>
          <h2>Practise</h2>
          <p style="display: flex; flex-wrap: wrap; gap: 1rem">
            <a href="/speaking">Speaking practice</a>
            <a href="/writing">Writing practice</a>
            <a href="/listening">Listening tests</a>
            <a href="/reading">Reading tests</a>
            <a href="/bank">Question bank</a>
          </p>
        </main>
        <footer style="max-width: 40rem; margin: 0 auto; padding: 0 1rem 4rem; font-family: system-ui, sans-serif; line-height: 1.55">
          <p style="display: flex; flex-wrap: wrap; gap: 1rem">
            <a href="/about">About</a>
            <a href="/privacy">Privacy</a>
            <a href="/terms">Terms</a>
            <a href="/refunds">Refunds</a>
            <a href="/delivery">Delivery</a>
            <a href="/contact">Contact</a>
            <a href="mailto:support@nextband.app">support@nextband.app</a>
          </p>
          <p>NextBand is made by Dolphin Commerce, Mymensingh, Bangladesh.</p>
        </footer>
      </noscript>
      <!--/page-->
    </div>
    <!-- Boot cover: a plain background until the first page resolves (main.tsx removes it); a load past 700 ms gets the full splash on top. -->
    <style>
      #boot { position: fixed; inset: 0; background: #f7f9fb; z-index: 50; pointer-events: none; transition: opacity .2s; }
      .dark #boot { background: #0a111c; }
    </style>
    <div id="boot" role="progressbar" aria-label="Loading NextBand"></div>
    <script>
      // The landing page paints its static shell first, so '/' never shows the cover or the slow-load splash (an account,
      // on its way to /overview, keeps the cover).
      if (document.documentElement.hasAttribute('data-lp-pre')) document.getElementById('boot').remove();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
